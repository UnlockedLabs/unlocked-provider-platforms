name: govulncheck

# Checks the code, its dependencies and the Go version it builds with against
# the Go vulnerability database on every PR, so vulnerabilities are fixed
# before they reach main, as unlocked-core's PR scan does. Vulnerabilities fail
# the check and, when the repository can see a SLACK_WEBHOOK_URL secret, post
# to #unlockedv2-alerts.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The Dockerfile's golang image has no patch number, so the image
          # builds with the newest patch. Check that one, not an older one
          # cached on the runner.
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # govulncheck exits 3 when it finds vulnerabilities, and with another
      # non-zero code when it couldn't check, such as a module download error.
      # Only the first is reported as vulnerabilities, and only it goes to Slack.
      - name: Run govulncheck
        id: scan
        run: |
          set +e
          "$(go env GOPATH)/bin/govulncheck" ./... > govulncheck.txt 2>&1
          code=$?
          cat govulncheck.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) ;;
            3) echo "::error::govulncheck found vulnerabilities"; exit 1 ;;
            *) echo "::error::govulncheck couldn't finish (exit $code), so nothing was checked. Re-run the job."; exit 1 ;;
          esac

      - name: Tell Slack
        if: failure() && steps.scan.outputs.exit_code == '3' && github.event_name == 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::notice::SLACK_WEBHOOK_URL isn't set, so nothing was posted to Slack"
            exit 0
          fi
          details=$(head -c 2000 govulncheck.txt)
          if [[ $(wc -c < govulncheck.txt) -gt 2000 ]]; then
            details+="... (truncated, see full output in workflow logs)"
          fi
          text=$(cat <<EOF
          :rotating_light: *SECURITY VULNERABILITIES DETECTED* :rotating_light:

          Repository: $REPO
          PR: #$PR_NUMBER - $PR_TITLE
          Author: $PR_AUTHOR
          Branch: $PR_BRANCH

          This PR contains Go security vulnerabilities and has been blocked from merging until fixed.

          *Vulnerability Details:*
          $details

          :wrench: *Actions needed:*
          1. Bump the go line in go.mod if the fix is in the standard library, or update the module: \`go get <module>@<safe-version>\`
          2. Push updates to the PR

          *PR Link:* $PR_URL
          EOF
          )
          jq -n --arg text "$text" \
            '{channel: "#unlockedv2-alerts", username: "Security Bot", icon_emoji: ":warning:", text: $text}' \
            | curl --fail --silent --show-error --max-time 10 \
                -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Failed to send the Slack notification"
